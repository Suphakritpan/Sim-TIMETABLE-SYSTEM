<h1>แกลเลอรีภาพหน้าจอ</h1><p>เก็บด้วย Playwright จากเว็บที่ build ล่าสุดในโหมดจำลอง (ข้อมูลตัวอย่าง ไม่ใช่ผลจากอัลกอริทึมจริง) — คลิกภาพเพื่อดูเต็มหน้า</p>
<h2>เดสก์ท็อป 1440px</h2><div class="g"><figure class="desktop"><a href="desktop/01-import-empty.png"><img src="desktop/01-import-empty.png" alt="1 นำเข้าข้อมูล — หน้าว่าง: ช่องอัปโหลด + ไฟล์แม่แบบ/ตัวอย่าง 3 ขนาด"></a><figcaption><b>01</b> 1 นำเข้าข้อมูล<br><span>หน้าว่าง: ช่องอัปโหลด + ไฟล์แม่แบบ/ตัวอย่าง 3 ขนาด</span></figcaption></figure><figure class="desktop"><a href="desktop/02-import-invalid.png"><img src="desktop/02-import-invalid.png" alt="1 นำเข้าข้อมูล — ข้อมูลผิด: ตารางปัญหาทุกจุด (แผ่นงาน/แถว/วิธีแก้) ปุ่มยืนยันถูกล็อก"></a><figcaption><b>02</b> 1 นำเข้าข้อมูล<br><span>ข้อมูลผิด: ตารางปัญหาทุกจุด (แผ่นงาน/แถว/วิธีแก้) ปุ่มยืนยันถูกล็อก</span></figcaption></figure><figure class="desktop"><a href="desktop/03-import-valid.png"><img src="desktop/03-import-valid.png" alt="1 นำเข้าข้อมูล — ข้อมูลถูกต้อง: สรุปจำนวนครู/ห้อง/กลุ่ม/วิชา/รายการสอน/คำขอ"></a><figcaption><b>03</b> 1 นำเข้าข้อมูล<br><span>ข้อมูลถูกต้อง: สรุปจำนวนครู/ห้อง/กลุ่ม/วิชา/รายการสอน/คำขอ</span></figcaption></figure><figure class="desktop"><a href="desktop/04-import-confirmed.png"><img src="desktop/04-import-confirmed.png" alt="1 นำเข้าข้อมูล — ยืนยันแล้ว: ปุ่มไปหน้าคำขอพิเศษ"></a><figcaption><b>04</b> 1 นำเข้าข้อมูล<br><span>ยืนยันแล้ว: ปุ่มไปหน้าคำขอพิเศษ</span></figcaption></figure><figure class="desktop"><a href="desktop/05-requests-unconfirmed.png"><img src="desktop/05-requests-unconfirmed.png" alt="2 คำขอพิเศษ — คำขอทุกข้อคู่กับ "ระบบเข้าใจว่า" + แบบ + ติ๊กยืนยัน + ฟอร์มเพิ่มคำขอ"></a><figcaption><b>05</b> 2 คำขอพิเศษ<br><span>คำขอทุกข้อคู่กับ "ระบบเข้าใจว่า" + แบบ + ติ๊กยืนยัน + ฟอร์มเพิ่มคำขอ</span></figcaption></figure><figure class="desktop"><a href="desktop/06-requests-confirmed.png"><img src="desktop/06-requests-confirmed.png" alt="2 คำขอพิเศษ — ยืนยันครบ 6 จาก 6 ข้อ"></a><figcaption><b>06</b> 2 คำขอพิเศษ<br><span>ยืนยันครบ 6 จาก 6 ข้อ</span></figcaption></figure><figure class="desktop"><a href="desktop/07-generate-idle.png"><img src="desktop/07-generate-idle.png" alt="3 จัดตาราง — พร้อมจัด: ช่อง seed + ปุ่มจัดตาราง"></a><figcaption><b>07</b> 3 จัดตาราง<br><span>พร้อมจัด: ช่อง seed + ปุ่มจัดตาราง</span></figcaption></figure><figure class="desktop"><a href="desktop/08-generate-running.png"><img src="desktop/08-generate-running.png" alt="3 จัดตาราง — กำลังคำนวณ: แถบ indeterminate + ขั้นตอนจริง + ปุ่มยกเลิก"></a><figcaption><b>08</b> 3 จัดตาราง<br><span>กำลังคำนวณ: แถบ indeterminate + ขั้นตอนจริง + ปุ่มยกเลิก</span></figcaption></figure><figure class="desktop"><a href="desktop/09-generate-cancel-dialog.png"><img src="desktop/09-generate-cancel-dialog.png" alt="3 จัดตาราง — ป๊อปอัปยืนยันยกเลิกงาน"></a><figcaption><b>09</b> 3 จัดตาราง<br><span>ป๊อปอัปยืนยันยกเลิกงาน</span></figcaption></figure><figure class="desktop"><a href="desktop/10-generate-cancelled.png"><img src="desktop/10-generate-cancelled.png" alt="3 จัดตาราง — ยกเลิกแล้ว: ปุ่มเปลี่ยนเป็น "จัดใหม่""></a><figcaption><b>10</b> 3 จัดตาราง<br><span>ยกเลิกแล้ว: ปุ่มเปลี่ยนเป็น "จัดใหม่"</span></figcaption></figure><figure class="desktop"><a href="desktop/11-generate-seed-error.png"><img src="desktop/11-generate-seed-error.png" alt="3 จัดตาราง — seed ไม่ถูกต้อง: ข้อความผิดพลาดใต้ช่อง"></a><figcaption><b>11</b> 3 จัดตาราง<br><span>seed ไม่ถูกต้อง: ข้อความผิดพลาดใต้ช่อง</span></figcaption></figure><figure class="desktop"><a href="desktop/12-generate-result.png"><img src="desktop/12-generate-result.png" alt="3 จัดตาราง — ผลตรวจ: จัดครบ/ชน/ผิดกฎ/คะแนนโทษ/เวลา + อธิบายลำดับการจัด"></a><figcaption><b>12</b> 3 จัดตาราง<br><span>ผลตรวจ: จัดครบ/ชน/ผิดกฎ/คะแนนโทษ/เวลา + อธิบายลำดับการจัด</span></figcaption></figure><figure class="desktop"><a href="desktop/13-timetable-group.png"><img src="desktop/13-timetable-group.png" alt="4 ดูตาราง — ตามกลุ่มเรียน: ตารางรายสัปดาห์ + พักกลางวัน + กิจกรรม + จำนวนคาบรวม"></a><figcaption><b>13</b> 4 ดูตาราง<br><span>ตามกลุ่มเรียน: ตารางรายสัปดาห์ + พักกลางวัน + กิจกรรม + จำนวนคาบรวม</span></figcaption></figure><figure class="desktop"><a href="desktop/14-timetable-teacher.png"><img src="desktop/14-timetable-teacher.png" alt="4 ดูตาราง — ตามครู"></a><figcaption><b>14</b> 4 ดูตาราง<br><span>ตามครู</span></figcaption></figure><figure class="desktop"><a href="desktop/15-timetable-room.png"><img src="desktop/15-timetable-room.png" alt="4 ดูตาราง — ตามห้อง"></a><figcaption><b>15</b> 4 ดูตาราง<br><span>ตามห้อง</span></figcaption></figure><figure class="desktop"><a href="desktop/16-timetable-search-nomatch.png"><img src="desktop/16-timetable-search-nomatch.png" alt="4 ดูตาราง — ค้นหาแล้วไม่พบ"></a><figcaption><b>16</b> 4 ดูตาราง<br><span>ค้นหาแล้วไม่พบ</span></figcaption></figure><figure class="desktop"><a href="desktop/17-evaluation-empty.png"><img src="desktop/17-evaluation-empty.png" alt="5 ผลการใช้ AI — ก่อนเปรียบเทียบ"></a><figcaption><b>17</b> 5 ผลการใช้ AI<br><span>ก่อนเปรียบเทียบ</span></figcaption></figure><figure class="desktop"><a href="desktop/18-evaluation-result.png"><img src="desktop/18-evaluation-result.png" alt="5 ผลการใช้ AI — ตารางเทียบ + กราฟ + อธิบายวิธี (ป้ายข้อมูลจำลอง)"></a><figcaption><b>18</b> 5 ผลการใช้ AI<br><span>ตารางเทียบ + กราฟ + อธิบายวิธี (ป้ายข้อมูลจำลอง)</span></figcaption></figure><figure class="desktop"><a href="desktop/19-summary.png"><img src="desktop/19-summary.png" alt="6 สรุปและส่งออก — ปุ่มดาวน์โหลด + ห้องใช้กี่ % + คาบต่อครู + คาบว่างกลุ่ม + ผลคำขอ"></a><figcaption><b>19</b> 6 สรุปและส่งออก<br><span>ปุ่มดาวน์โหลด + ห้องใช้กี่ % + คาบต่อครู + คาบว่างกลุ่ม + ผลคำขอ</span></figcaption></figure><figure class="desktop"><a href="desktop/20-summary-export-error.png"><img src="desktop/20-summary-export-error.png" alt="6 สรุปและส่งออก — ดาวน์โหลด PDF ในโหมดจำลอง: แจ้งว่ายังไม่รองรับ"></a><figcaption><b>20</b> 6 สรุปและส่งออก<br><span>ดาวน์โหลด PDF ในโหมดจำลอง: แจ้งว่ายังไม่รองรับ</span></figcaption></figure><figure class="desktop"><a href="desktop/21-not-found.png"><img src="desktop/21-not-found.png" alt="404 — หน้าไม่พบ"></a><figcaption><b>21</b> 404<br><span>หน้าไม่พบ</span></figcaption></figure></div>
