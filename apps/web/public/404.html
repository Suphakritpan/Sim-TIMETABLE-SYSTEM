<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ไม่พบหน้าที่ต้องการ — ระบบจัดตารางสอนอัตโนมัติ</title>
    <meta name="description" content="ไม่พบหน้าที่ต้องการ ลิงก์อาจผิดหรือหน้านี้ถูกย้ายแล้ว" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Noto Sans Thai", system-ui, sans-serif; color: #0F172A; background: #fff; }
      main { max-width: 28rem; margin: 1rem; padding: 2rem; text-align: center; border: 1px solid #E4ECFC; border-radius: 20px; box-shadow: 0 12px 24px -16px rgb(37 99 235 / 0.18); }
      h1 { font-family: "Noto Serif Thai", serif; font-size: 1.75rem; margin: 0 0 .5rem; }
      p { color: #475569; margin: 0 0 1.5rem; line-height: 1.7; }
      a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1.25rem; border-radius: 12px; background: #2563EB; color: #fff; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #1E40AF; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>ไม่พบหน้าที่ต้องการ</h1>
      <p>ลิงก์อาจผิด หรือหน้านี้ถูกย้ายแล้ว</p>
      <a href="/">กลับหน้าแรก</a>
    </main>
  </body>
</html>
