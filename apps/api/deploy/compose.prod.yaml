# Production: Caddy (HTTPS) -> API, worker and database. Only Caddy opens a port.
# Run from apps/api: docker compose -f deploy/compose.prod.yaml --env-file deploy/.env up -d --build
name: sim-timetable-prod

services:
  db:
    image: postgres:17.2-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: app
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 5s
      retries: 12

  api:
    build: ..
    restart: unless-stopped
    # Caddy replaces any X-Forwarded-For a caller sends, and this port is reachable only from Caddy.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"
    environment: &app_env
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD}@db:5432/app
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in deploy/.env}
      MAX_UPLOAD_MB: 10
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      retries: 6
      start_period: 20s

  worker:
    build: ..
    restart: unless-stopped
    command: python -m app.worker
    environment: *app_env
    mem_limit: 1g
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2.9.1-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  dbdata:
  caddydata:
